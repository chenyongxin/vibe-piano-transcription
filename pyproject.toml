[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano2"
version = "0.2.3"
description = "钢琴转录：音频 → 音符事件 → 可读乐谱"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "librosa",
    "soundfile",
    "pretty_midi",
    "music21",
    "mir_eval",
    "matplotlib",
    "verovio",
    "pymupdf",
    "lxml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
