name: release-images

# Release 流程：
# 1. 先在 GitHub 创建 Release（tag 形如 v0.3.0）并上传 best.pt；
# 2. 发布 Release 后本 workflow 自动用该 tag 的提交构建 CPU/GPU 镜像；
# 3. 也可以手动 workflow_dispatch，输入已经存在的 tag。
#
# 不在 main/tag push 时直接构建，是为了保证镜像里下载的权重和 Release
# 使用的是同一个 tag，避免 tag 先到而权重 asset 还不存在。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            dockerfile: Dockerfile.cpu
          - name: gpu
            dockerfile: Dockerfile.gpu
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Verify model asset exists
        shell: bash
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/best.pt"
          echo "Checking ${URL}"
          curl -L --fail --retry 3 --retry-delay 5 --head "${URL}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}-${{ matrix.name }}
            ghcr.io/${{ github.repository }}:${{ matrix.name }}
          build-args: |
            MODEL_URL=https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/best.pt
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
