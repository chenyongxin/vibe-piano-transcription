name: docker-smoke

# 在 main 上提前验证 CPU 多架构构建，不推送镜像。
# 这样 v0.3.1 打 tag 之前就能发现 arm64 依赖或 QEMU 构建问题。

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.cpu
      - Dockerfile.gpu
      - requirements.txt
      - pyproject.toml
      - .github/workflows/docker-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build CPU multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=cpu-smoke
          cache-to: type=gha,mode=max,scope=cpu-smoke
