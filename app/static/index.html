<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>piano2 · 钢琴录音转乐谱</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">piano2</div>
  </header>

  <main class="wrap">
    <!-- 初始状态：只有选择文件；选择后不自动转录 -->
    <section class="card" id="upload-card">
      <div class="dropzone" id="dropzone">
        <div class="dz-icon">🎹</div>
        <div class="dz-title">把钢琴录音拖到这里</div>
        <div class="dz-hint">
          支持 wav / mp3 / m4a / flac，最多 10 首、总大小 ≤ 100 MB；只支持独奏钢琴。<br />
          选择后先进入曲目列表，不会自动转录。
        </div>
        <button class="btn primary" id="pick-btn">选择文件</button>
        <input type="file" id="file-input" accept="audio/*" multiple hidden />
      </div>
      <div class="error" id="upload-error" hidden></div>
    </section>

    <!-- 队列 / 结果列表：添加、转录、删除 -->
    <section class="card" id="tracks-card" hidden>
      <div class="result-head">
        <div>
          <div class="result-title" id="tracks-title">曲目列表</div>
          <div class="muted" id="tracks-summary"></div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="add-btn">继续添加</button>
          <button class="btn primary" id="start-btn">开始转录</button>
        </div>
      </div>
      <div class="error" id="tracks-error" hidden></div>
      <div class="track-list" id="track-list"></div>
      <div class="hint muted" id="tracks-hint">
        每首曲目转录完成后可以单独打开；已完成的曲目也可以删除，再添加新曲目继续转录。
      </div>
    </section>

    <!-- 谱面查看器：单页左右翻页 -->
    <section class="card" id="score-card" hidden>
      <div class="result-head">
        <div>
          <div class="result-title" id="score-title">转录结果</div>
          <div class="muted" id="score-stats"></div>
        </div>
        <div class="actions">
          <a class="btn ghost" id="dl-xml" download>下载 MusicXML</a>
          <a class="btn ghost" id="dl-pdf" download>下载 PDF</a>
          <a class="btn ghost" id="dl-mid" download>下载 MIDI</a>
          <button class="btn ghost" id="score-add-btn">添加曲目</button>
          <button class="btn ghost" id="back-btn">← 曲目列表</button>
        </div>
      </div>

      <audio id="player" controls preload="metadata"></audio>

      <div class="viewer-toolbar">
        <button class="btn ghost" id="prev-page" aria-label="上一页">← 上一页</button>
        <span class="page-indicator" id="page-indicator">第 1 / 1 页</span>
        <button class="btn ghost" id="next-page" aria-label="下一页">下一页 →</button>
        <button class="btn primary" id="follow-btn" hidden>回到当前</button>
      </div>

      <div class="hint muted">
        播放时当前页自动跟随、当前小节高亮；你翻到别的页后会出现「回到当前」，暂停时不显示。
      </div>
      <div class="score-viewport" id="score-viewport">
        <div class="pages" id="pages"></div>
      </div>
      <div class="error" id="score-error" hidden></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
